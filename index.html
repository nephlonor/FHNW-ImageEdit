<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FHNW ImageEditor</title>
<meta name="theme-color" content="#0c0c0c">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
    <div class="wrap header-inner">
        <img class="fhnw-logo" src="assets/fhnw-logo.svg" alt="Fachhochschule Nordwestschweiz FHNW" width="217" height="50">
        <h1>FHNW ImageEditor</h1>
    </div>
</header>

<div class="wrap api-slot" id="apiSlotTop"></div>

<main class="wrap">

    <nav class="tabs" role="tablist" aria-label="Modus">
        <button class="tab is-active" id="tabEdit" role="tab" aria-selected="true" data-mode="edit">Edit</button>
        <button class="tab" id="tabInpaint" role="tab" aria-selected="false" data-mode="inpaint">Inpaint</button>
    </nav>

    <section class="card hidden" id="inpaintSection">
        <label class="btn btn-primary btn-block" for="inpaintUpload">Basisbild</label>
        <input type="file" id="inpaintUpload" accept="image/*" hidden>

        <div class="inpaint-stage hidden" id="inpaintStage">
            <canvas id="baseCanvas"></canvas>
            <canvas id="maskView"></canvas>
        </div>

        <div class="inpaint-tools hidden" id="inpaintTools">
            <div class="btn-row">
                <button class="btn btn-ghost is-active" id="brushBtn" type="button">Pinsel</button>
                <button class="btn btn-ghost" id="eraseBtn" type="button">Radierer</button>
                <button class="btn btn-ghost" id="undoBtn" type="button">Zurück</button>
                <button class="btn btn-ghost" id="clearMaskBtn" type="button">Leeren</button>
            </div>
            <div class="slider-row">
                <label for="brushSize">Pinsel</label>
                <input type="range" id="brushSize" min="6" max="160" value="48">
                <output id="brushSizeOut">48</output>
            </div>
            <div class="slider-row">
                <label for="featherRange">Kante</label>
                <input type="range" id="featherRange" min="0" max="40" value="10">
                <output id="featherOut">10</output>
            </div>
        </div>
    </section>

    <section class="card">
        <label class="btn btn-primary btn-block" for="imageUpload" id="uploadLabel">Bilder</label>
        <input type="file" id="imageUpload" accept="image/*" multiple hidden>
        <div class="preview-grid" id="previewGrid"></div>
    </section>

    <section class="card" id="formatCard">
        <div class="format-row">
            <select id="ratioSelect" aria-label="Seitenverhältnis"></select>
            <div class="seg" id="tierSeg" role="group" aria-label="Grösse">
                <button class="seg-btn is-active" type="button" data-tier="2K">2K</button>
                <button class="seg-btn" type="button" data-tier="4K">4K</button>
            </div>
        </div>
        <label class="check">
            <input type="checkbox" id="bgTransparent">
            <span>Transparenter Hintergrund</span>
        </label>
    </section>

    <section class="card">
        <textarea id="prompt" rows="4" placeholder="Prompt"></textarea>
        <button class="btn btn-primary btn-block btn-generate" id="genBtn" type="button">Generieren</button>
    </section>

    <section id="jobs" class="jobs" aria-live="polite"></section>

    <details class="card history" id="historyCard">
        <summary>
            <span>Verlauf</span>
            <span class="history-count" id="historyCount"></span>
        </summary>
        <div class="history-body">
            <div class="history-grid" id="historyGrid"></div>
            <button class="btn btn-ghost btn-small" id="historyClear" type="button">Verlauf löschen</button>
        </div>
    </details>

</main>

<div class="wrap api-slot" id="apiSlotBottom"></div>

<footer class="site-footer">
    <div class="wrap">ImageEdit by Florian Bertram / FHNW 2026</div>
</footer>

<template id="apiPanelTemplate">
    <section class="api-panel" id="apiPanel">
        <div class="api-open">
            <div class="api-row">
                <label for="apiKey" class="api-label">API:</label>
                <input type="password" id="apiKey" autocomplete="off" autocapitalize="off" spellcheck="false">
                <button class="btn btn-primary" id="apiSave" type="button">Bestätigen</button>
            </div>
        </div>
        <div class="api-stowed">
            <span class="api-mask" id="apiMask"></span>
            <button class="btn btn-ghost btn-small" id="apiEdit" type="button">ändern</button>
            <button class="btn btn-ghost btn-small" id="apiClear" type="button">löschen</button>
        </div>
    </section>
</template>

<div class="lightbox" id="lightbox" hidden>
    <img id="lightboxImg" alt="">
</div>

<script src="app.js"></script>
</body>
</html>
